# Talos supplies the NVIDIA driver and container toolkit through the Image
# Factory schematic. The operator manages only the Kubernetes GPU operands.
driver:
  enabled: false

toolkit:
  enabled: false

# Run one NFD instance from this operator. It discovers both GPU vendors; the
# AMD operator does not install a second instance.
nfd:
  enabled: true

node-feature-discovery:
  worker:
    nodeSelector:
      ai.cisien.com/vendor: nvidia
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: ""
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: ai.cisien.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule

# GPU workload Pods use the NVIDIA runtime supplied by the Talos extension.

daemonsets:
  tolerations:
    - key: ai.cisien.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule

# These workload modes are not used on the two dedicated RTX 3090 GPUs.
migManager:
  enabled: false
vfioManager:
  enabled: false
vgpuDeviceManager:
  enabled: false
ccManager:
  enabled: false
sandboxDevicePlugin:
  enabled: false
kataSandboxDevicePlugin:
  enabled: false

dcgmExporter:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
