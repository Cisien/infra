# Talos supplies the NVIDIA driver and container toolkit through the Image
# Factory schematic. The operator manages only the Kubernetes GPU operands.
driver:
  enabled: false

toolkit:
  enabled: false

# Only the GB10 node uses time-sliced GPU access. It advertises two
# nvidia.com/gpu.shared resources, while existing NVIDIA workers retain their
# exclusive nvidia.com/gpu resources. The matching Node label is generated by
# terraform/physical-ai-workers.tf.
devicePlugin:
  config:
    create: true
    name: nvidia-device-plugin-config
    data:
      gb10-time-slicing: |-
        version: v1
        flags:
          migStrategy: none
        sharing:
          timeSlicing:
            renameByDefault: true
            failRequestsGreaterThanOne: true
            resources:
              - name: nvidia.com/gpu
                replicas: 2

# Run one NFD instance from this operator. It discovers both GPU vendors; the
# AMD operator does not install a second instance.
nfd:
  enabled: true

node-feature-discovery:
  worker:
    nodeSelector:
      ai.cisien.com/vendor: nvidia
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: ""
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: ai.cisien.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule

# GPU workload Pods use the NVIDIA runtime supplied by the Talos extension.

daemonsets:
  tolerations:
    - key: ai.cisien.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule

# These workload modes are not used on the two dedicated RTX 3090 GPUs.
migManager:
  enabled: false
vfioManager:
  enabled: false
vgpuDeviceManager:
  enabled: false
ccManager:
  enabled: false
sandboxDevicePlugin:
  enabled: false
kataSandboxDevicePlugin:
  enabled: false

dcgmExporter:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
