extraSecretMounts:
  - name: snmp-exporter-config
    mountPath: /run/secrets/snmp-exporter
    secretName: snmp-exporter-config
    readOnly: true

extraArgs:
  - --config.file=/run/secrets/snmp-exporter/snmp.yml

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

serviceMonitor:
  enabled: true
  namespace: monitoring
  module:
    - if_mib
    - system
  auth:
    - unas_v3
  selector:
    release: monitoring
  params:
    - name: unas-pro
      target: 192.168.1.250
      interval: 60s
      scrapeTimeout: 30s
      additionalMetricsRelabels:
        device: unas-pro
  selfMonitor:
    enabled: true
    labels:
      release: monitoring
    interval: 60s
