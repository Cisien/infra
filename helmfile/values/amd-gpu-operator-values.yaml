# Talos supplies amdgpu and AMD microcode through the Image Factory schematic.
# The operator therefore deploys only Kubernetes-level AMD GPU components.
node-feature-discovery:
  enabled: false

kmm:
  enabled: false
  watch: false

remediation:
  enabled: false
  installCRDs: false

# The default chart DeviceConfig has a mandatory NFD selector that is not valid
# for the Strix Halo iGPU. The explicit manifest in kubernetes/apps owns it.
crds:
  defaultCR:
    install: false
    upgrade: false

installdefaultNFDRule: false

deviceConfig:
  spec:
    selector:
      ai.cisien.com/vendor: amd
    driver:
      enable: false
    devicePlugin:
      devicePluginTolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeLabellerTolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
    metricsExporter:
      tolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      prometheus:
        serviceMonitor:
          enable: true
          labels:
            release: monitoring
