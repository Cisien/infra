# Talos supplies amdgpu and AMD microcode through the Image Factory schematic.
# The operator therefore deploys only Kubernetes-level AMD GPU components.
node-feature-discovery:
  enabled: false

kmm:
  enabled: false
  watch: false

remediation:
  enabled: false
  installCRDs: false

installdefaultNFDRule: false

deviceConfig:
  spec:
    selector:
      ai.cisien.com/vendor: amd
      feature.node.kubernetes.io/amd-gpu: null
    driver:
      enable: false
    devicePlugin:
      devicePluginTolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeLabellerTolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
    metricsExporter:
      tolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      prometheus:
        serviceMonitor:
          enable: true
          labels:
            release: monitoring
