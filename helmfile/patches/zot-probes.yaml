apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oci-registry-zot
  namespace: ai
spec:
  template:
    spec:
      containers:
        - name: zot
          livenessProbe:
            failureThreshold: 10
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 10
            periodSeconds: 30
            timeoutSeconds: 10
