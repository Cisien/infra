apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: karpenter-nfs-sample
spec:
  replicas: 2
  selector:
    matchLabels:
      app: karpenter-nfs-writer
  template:
    metadata:
      labels:
        app: karpenter-nfs-writer
    spec:
      nodeSelector:
        karpenter.sh/nodepool: elastic-workers
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: karpenter-nfs-writer
              topologyKey: kubernetes.io/hostname
      containers:
        - name: writer
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                printf '%s %s\n' "$(date -Iseconds)" "$HOSTNAME" >> /data/writers.log
                sleep 10
              done
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: shared-data
              mountPath: /data
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data
