# VLAN 2000 internal Gateway. The public Gateway uses 172.16.200.254.
# This listener intentionally has no HTTPS listener until an internal CA is available.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: gateway-system
spec:
  gatewayClassName: public
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.local.cisien.com"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.local.cisien.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: internal-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
