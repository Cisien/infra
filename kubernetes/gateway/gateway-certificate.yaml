apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: gateway-system
spec:
  secretName: gateway-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - search.cisien.dev
    - wavelog.cisien.dev
    - dash.cisien.dev
    - ha.cisien.com
    - gitlab.cisien.com
    - ai.cisien.com
    - registry.cisien.com
    - cloud.cisien.com
