apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nas-nfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.1.250
  share: /volume/a86e2708-3047-42c6-8f99-1d8cc5192c9d/.srv/.unifi-drive/kubernetes/.data
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  # NFSv3 is served on TCP/2049. Let rpcbind discover mountd: the NAS selects
  # a new dynamic mountd port after a service restart or reboot.
  - nfsvers=3
  - nolock
  - proto=tcp
  - port=2049
  - mountproto=tcp
