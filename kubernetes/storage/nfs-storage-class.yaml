apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nas-nfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.1.250
  share: /volume/a86e2708-3047-42c6-8f99-1d8cc5192c9d/.srv/.unifi-drive/kubernetes/.data
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  # The NAS NFSv3 service is fixed on TCP/2049, but its rpcbind lookup is not
  # reachable from worker VLANs. Use the current TCP mountd port directly.
  # The port was verified from a worker with `rpcinfo -p 192.168.1.250`.
  - nfsvers=3
  - nolock
  - proto=tcp
  - port=2049
  - mountproto=tcp
  - mountport=50491
