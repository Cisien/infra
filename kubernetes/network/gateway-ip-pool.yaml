# 172.16.200.254 is reserved for the public Gateway LoadBalancer Service on
# VLAN 2000. Exclude it from DHCP and fixed Talos VM allocations.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: public-gateway
spec:
  blocks:
    - start: 172.16.200.254
      stop: 172.16.200.254
