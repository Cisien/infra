apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-loadbalancers
spec:
  # VLAN 2000 elastic workers must not announce the LAN Gateway IP.
  nodeSelector:
    matchExpressions:
      - key: karpenter.sh/nodepool
        operator: DoesNotExist
  externalIPs: true
  loadBalancerIPs: true
  interfaces:
    - ^eth0
