apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-loadbalancers
spec:
  # VLAN 2000 workers and dedicated AI workers must not announce the
  # 172.16.0.0/24 LAN Gateway IP.
  nodeSelector:
    matchExpressions:
      - key: karpenter.sh/nodepool
        operator: DoesNotExist
      - key: ai.cisien.com/role
        operator: DoesNotExist
      - key: games.cisien.com/role
        operator: DoesNotExist
  externalIPs: true
  loadBalancerIPs: true
  interfaces:
    - ^eth0
