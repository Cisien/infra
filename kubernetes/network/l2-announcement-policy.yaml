apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-loadbalancers
spec:
  # Only VLAN 2000 control-plane VMs announce the VLAN 2000 Gateway IPs.
  # Talos custom installer images use ens18; retain eth0 for generic images.
  nodeSelector:
    matchExpressions:
      - key: homelab.cisien.com/network
        operator: In
        values:
          - vlan-2000
      - key: homelab.cisien.com/role
        operator: DoesNotExist
      - key: ai.cisien.com/role
        operator: DoesNotExist
      - key: games.cisien.com/role
        operator: DoesNotExist
  externalIPs: true
  loadBalancerIPs: true
  interfaces:
    - ^(ens18|eth0)$
