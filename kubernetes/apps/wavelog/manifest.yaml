apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dbdata
  namespace: wavelog
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-nfs
  resources:
    requests:
      # Set this to at least the measured source volume size before migration.
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: wavelog
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nas-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: wavelog
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nas-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: userdata
  namespace: wavelog
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nas-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wavelog-db
  namespace: wavelog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wavelog-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wavelog-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:12.3.2-noble
          # The migrated NFS files are owned by UID:GID 977:988. Running as
          # this owner skips the image entrypoint's root-only recursive chown,
          # which NFS root-squash rejects.
          securityContext:
            runAsUser: 977
            runAsGroup: 988
            runAsNonRoot: true
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: db-env
          volumeMounts:
            - name: dbdata
              mountPath: /var/lib/mysql
      volumes:
        - name: dbdata
          persistentVolumeClaim:
            claimName: dbdata
---
apiVersion: v1
kind: Service
metadata:
  name: wavelog-db
  namespace: wavelog
spec:
  selector:
    app.kubernetes.io/name: wavelog-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wavelog-main
  namespace: wavelog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wavelog-main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wavelog-main
    spec:
      containers:
        - name: wavelog
          image: ghcr.io/wavelog/wavelog:3.1.0
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: app-env
          volumeMounts:
            - name: config
              mountPath: /var/www/html/application/config/docker
            - name: uploads
              mountPath: /var/www/html/uploads
            - name: userdata
              mountPath: /var/www/html/userdata
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
        - name: userdata
          persistentVolumeClaim:
            claimName: userdata
---
apiVersion: v1
kind: Service
metadata:
  name: wavelog-main
  namespace: wavelog
spec:
  selector:
    app.kubernetes.io/name: wavelog-main
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wavelog
  namespace: wavelog
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - wavelog.cisien.dev
  rules:
    - backendRefs:
        - name: wavelog-main
          port: 80
