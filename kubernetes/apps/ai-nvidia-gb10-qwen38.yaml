apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nvidia-gb10-model-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ai-local
  volumeName: ai-nvidia-02-data
  resources:
    requests:
      storage: 800Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvidia-gb10-qwen38
  namespace: ai
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-gb10-qwen38
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-gb10-qwen38
    spec:
      nodeSelector:
        ai.cisien.com/accelerator: gb10
      tolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.27.1
          args:
            - unsloth/Qwen3.8-27B-NVFP4
            - --served-model-name
            - competent-robot
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --max-model-len
            - "262144"
            - --max-num-seqs
            - "4"
            - --gpu-memory-utilization
            - "0.90"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_xml
            - --enable-prefix-caching
          env:
            - name: HF_HOME
              value: /models/huggingface
            - name: VLLM_CACHE_ROOT
              value: /models/vllm
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu.shared: 1
            limits:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu.shared: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 180
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: nvidia-gb10-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-gb10-qwen38
  namespace: ai
  labels:
    metrics: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: nvidia-gb10-qwen38
  ports:
    - name: http
      port: 8080
      targetPort: http
