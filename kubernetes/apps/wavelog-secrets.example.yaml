# Do not apply this file. Copy it to db-env.secret.yaml, replace every value
# with the current Wavelog MariaDB environment value, then apply that copy.
apiVersion: v1
kind: Secret
metadata:
  name: db-env
  namespace: wavelog
type: Opaque
stringData:
  MARIADB_RANDOM_ROOT_PASSWORD: REPLACE_WITH_CURRENT_VALUE
  MARIADB_DATABASE: REPLACE_WITH_CURRENT_VALUE
  MARIADB_USER: REPLACE_WITH_CURRENT_VALUE
  MARIADB_PASSWORD: REPLACE_WITH_CURRENT_VALUE
---
# Do not apply this file. Copy it to app-env.secret.yaml, replace the value with
# the current Wavelog environment value, then apply that copy.
apiVersion: v1
kind: Secret
metadata:
  name: app-env
  namespace: wavelog
type: Opaque
stringData:
  CI_ENV: REPLACE_WITH_CURRENT_VALUE
