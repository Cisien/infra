apiVersion: v1
data:
  laguna-s-2.1-chat-template.jinja: "{%- set template_version = \"laguna-s21-froggeric-v24.0-loopguard\"
    -%}\n{#- Native Laguna format: <system>, <user>, <assistant>, <think>, <tool_call>/<arg_key>/<arg_value>,
    <tool_response>. -#}\n{{- \"〈|EOS|〉\" -}}\n{%- set enable_thinking = enable_thinking
    if enable_thinking is defined else true -%}\n{%- set preserve_thinking = preserve_thinking
    if preserve_thinking is defined else true -%}\n{%- set add_generation_prompt =
    add_generation_prompt if add_generation_prompt is defined else false -%}\n{%-
    set auto_disable_thinking_with_tools = auto_disable_thinking_with_tools if auto_disable_thinking_with_tools
    is defined else false -%}\n{%- set max_tool_arg_chars = max_tool_arg_chars if
    max_tool_arg_chars is defined else 0 -%}\n{%- set max_tool_response_chars = max_tool_response_chars
    if max_tool_response_chars is defined else 0 -%}\n{%- set sanitize_tool_tokens
    = sanitize_tool_tokens if sanitize_tool_tokens is defined else true -%}\n{%- set
    _tool_format = tool_call_format if tool_call_format is defined else 'xml' -%}\n{%-
    set enable_toolcall_instructions = enable_toolcall_instructions if enable_toolcall_instructions
    is defined else false -%}\n\n{#- LOOP-GUARD thresholds -#}\n{%- set fail_warn_after
    = fail_warn_after if fail_warn_after is defined else 2 -%}\n{%- set fail_halt_after
    = fail_halt_after if fail_halt_after is defined else 5 -%}\n{%- set repeat_warn_after
    = repeat_warn_after if repeat_warn_after is defined else 2 -%}\n{%- set repeat_halt_after
    = repeat_halt_after if repeat_halt_after is defined else 4 -%}\n{%- set repeat_nudge_after
    = repeat_nudge_after if repeat_nudge_after is defined else 6 -%}\n{%- set pingpong_nudge_after
    = pingpong_nudge_after if pingpong_nudge_after is defined else 4 -%}\n{%- set
    think_on_tool_failure = think_on_tool_failure if think_on_tool_failure is defined
    else true -%}\n{%- set warn_vanished_tools = warn_vanished_tools if warn_vanished_tools
    is defined else true -%}\n{%- set vanished_tools_window = vanished_tools_window
    if vanished_tools_window is defined else 10 -%}\n{%- set mutating_tools = mutating_tools
    if mutating_tools is defined else 'write edit multiedit patch apply_patch str_replace
    str_replace_editor str_replace_based_edit_tool write_file write_to_file replace_in_file
    replace_file_content apply_diff insert_content search_and_replace search_replace
    edit_file builtin_edit_existing_file create_file create_new_file builtin_create_new_file
    create replace text_editor notebookedit fs_write move_file create_directory reapply
    delete delete_file move rename mkdir bash terminal shell exec execute_code execute_command
    execute_bash run_shell_command run_terminal_command run_terminal_cmd run_command
    todo todowrite memory skill_manage delegate_task send_message cronjob process
    use_aws browser_click browser_type browser_press browser_scroll browser_navigate
    browser_action' -%}\n{%- set read_tools = read_tools if read_tools is defined
    else 'read read_file read_text_file read_multiple_files cat grep glob list ls
    search view fetch webfetch web_fetch websearch web_search web_search_exa rg ripgrep
    find find_file list_files list_directory list_dir glob_files codebase_search file_search
    head tail tree' -%}\n\n{%- macro render_content(content, is_system_content=false)
    -%}\n    {%- if content is string -%}\n        {{- content -}}\n    {%- elif content
    is iterable and content is not mapping -%}\n        {%- for item in content -%}\n
    \           {%- if item is mapping -%}\n                {%- if 'text' in item
    -%}\n                    {{- item.text -}}\n                {%- elif item.type
    == 'image' or 'image' in item or 'image_url' in item -%}\n                    {%-
    if is_system_content -%}\n                        {{- raise_exception('System
    message cannot contain images.') -}}\n                    {%- endif -%}\n                    {{-
    '[image]' -}}\n                {%- elif item.type == 'video' or 'video' in item
    -%}\n                    {%- if is_system_content -%}\n                        {{-
    raise_exception('System message cannot contain videos.') -}}\n                    {%-
    endif -%}\n                    {{- '[video]' -}}\n                {%- else -%}\n
    \                   {{- raise_exception('Unexpected item type in content.') -}}\n
    \               {%- endif -%}\n            {%- else -%}\n                {{- item
    | string -}}\n            {%- endif -%}\n        {%- endfor -%}\n    {%- elif
    content is none or content is undefined -%}\n        {{- '' -}}\n    {%- else
    -%}\n        {{- raise_exception('Unexpected content type.') -}}\n    {%- endif
    -%}\n{%- endmacro -%}\n\n{%- if not messages -%}\n    {{- raise_exception('No
    messages provided.') -}}\n{%- endif -%}\n\n{%- set _has_tools = (tools is defined
    and tools and tools is iterable and tools is not mapping) -%}\n{%- set cfg = namespace(thinking=enable_thinking)
    -%}\n{%- set skill_cfg = namespace(loader=false) -%}\n{%- set ns_deleg = namespace(name='')
    -%}\n{%- if auto_disable_thinking_with_tools and _has_tools -%}\n    {%- set cfg.thinking
    = false -%}\n{%- endif -%}\n\n{#- ───── system message ───── -#}\n{%- set system_message
    = \"You are a helpful, conversationally-fluent assistant made by Poolside. You
    are here to be helpful to users through natural language conversations.\" -%}\n{%-
    set _msgs = messages -%}\n{#- BACKPORT (v21): accept a leading developer message
    as the system message. Laguna has\n   no native developer tag, so developer folds
    into <system> exactly like system does. -#}\n{%- if messages and (messages[0].role
    == \"system\" or messages[0].role == \"developer\") -%}\n    {%- set system_message
    = render_content(messages[0].content, true) | trim -%}\n    {%- set _msgs = messages[1:]
    -%}\n    {%- if '<|think_off|>' in system_message -%}\n        {%- set cfg.thinking
    = false -%}\n        {%- set system_message = system_message.split('<|think_off|>')
    | join('') | trim -%}\n    {%- elif '<|think_on|>' in system_message -%}\n        {%-
    set cfg.thinking = true -%}\n        {%- set system_message = system_message.split('<|think_on|>')
    | join('') | trim -%}\n    {%- endif -%}\n    {#- BACKPORT (v13, via v21): strip
    llama.cpp <__media__> markers injected by --mmproj vision runs. #}\n    {%- if
    messages[0].content is string and '<__media__>' in system_message -%}\n        {%-
    set system_message = system_message.split('<__media__>') | join('') -%}\n    {%-
    endif -%}\n{%- endif -%}\n\n{#- PRE-SCAN -#}\n{%- set _prescan = namespace(failures=0,
    last_tool='', tool_ids='') -%}\n{%- for _pm in _msgs -%}\n    {%- if _pm.role
    == 'user' -%}\n        {%- set _prescan.failures = 0 -%}\n        {%- set _prescan.last_tool
    = '' -%}\n        {%- set _prescan.tool_ids = '' -%}\n    {%- elif _pm.role ==
    'assistant' -%}\n        {%- if _pm.tool_calls is defined and _pm.tool_calls and
    _pm.tool_calls is iterable and _pm.tool_calls is not mapping -%}\n            {%-
    set _pns = namespace(first='', n=0, ids='') -%}\n            {%- for _ptc in _pm.tool_calls
    -%}\n                {%- if _ptc.function is defined and _ptc.function is not
    none -%}\n                    {%- set _pf = _ptc.function -%}\n                {%-
    else -%}\n                    {%- set _pf = _ptc -%}\n                {%- endif
    -%}\n                {%- if _ptc.id is defined and _ptc.id and _pf.name -%}\n
    \                   {%- set _pns.ids = _pns.ids ~ '|' ~ _ptc.id ~ ':' ~ _pf.name
    -%}\n                {%- endif -%}\n                {%- set _pns.n = _pns.n +
    1 -%}\n                {%- if _pns.n == 1 -%}\n                    {%- set _pns.first
    = _pf.name -%}\n                {%- elif _pf.name != _pns.first -%}\n                    {%-
    set _pns.first = '' -%}\n                {%- endif -%}\n            {%- endfor
    -%}\n            {%- set _prescan.last_tool = _pns.first -%}\n            {%-
    set _prescan.tool_ids = _pns.ids -%}\n        {%- else -%}\n            {%- set
    _prescan.last_tool = '' -%}\n            {%- set _prescan.tool_ids = '' -%}\n
    \       {%- endif -%}\n    {%- elif _pm.role == 'tool' -%}\n        {%- set _prc_raw
    = render_content(_pm.content, false) | trim -%}\n        {%- if sanitize_tool_tokens
    -%}\n            {%- if '<|think_off|>' in _prc_raw -%}\n                {%- set
    _prc_raw = _prc_raw.split('<|think_off|>') | join('') | trim -%}\n            {%-
    endif -%}\n            {%- if '<|think_on|>' in _prc_raw -%}\n                {%-
    set _prc_raw = _prc_raw.split('<|think_on|>') | join('') | trim -%}\n            {%-
    endif -%}\n        {%- endif -%}\n        {%- set _prc = _prc_raw | lower -%}\n
    \       {%- set _p_head80 = _prc[:80] -%}\n        {%- set _p_head160 = _prc[:160]
    -%}\n        {%- set _p_result_tool = _prescan.last_tool -%}\n        {%- if _pm.tool_call_id
    is defined and _pm.tool_call_id and _prescan.tool_ids -%}\n            {%- set
    _p_idp = '|' ~ _pm.tool_call_id ~ ':' -%}\n            {%- if _p_idp in _prescan.tool_ids
    -%}\n                {%- set _p_result_tool = _prescan.tool_ids.split(_p_idp)[-1].split('|')[0]
    -%}\n            {%- endif -%}\n        {%- endif -%}\n        {%- set _p_read
    = _p_result_tool and (' ' ~ (_p_result_tool | lower) ~ ' ') in (' ' ~ (read_tools
    | lower) ~ ' ') -%}\n        {%- set _p_hard = (not _p_read) and (_p_head80.startswith('traceback')
    or _p_head80.startswith('error:') or _p_head80.startswith('fatal:') or _p_head80.startswith('exception:')
    or _p_head80.startswith('err:')) -%}\n        {%- set _p_harness = ('invalid input
    for tool' in _p_head80 or 'json parsing failed' in _p_head80 or 'unknown tool'
    in _p_head80 or 'error repairing' in _p_head80 or 'tool execution failed' in _p_head80)
    -%}\n        {%- set _p_generic = (not _p_read) and (\n            '\"error\":'
    in _p_head160 or 'error:' in _p_head160 or (' err:' in _p_head160 or '\\nerr:'
    in _p_head160) or 'err!' in _p_head160 or 'fatal:' in _p_head160 or 'exception:'
    in _p_head160 or\n            'traceback' in _p_head160 or 'command not found'
    in _p_head160 or\n            'invalid syntax' in _p_head160 or 'failed to' in
    _p_head160 or\n            'no such file' in _p_head160 or 'permission denied'
    in _p_head160 or\n            'not found' in _p_head160 or 'cannot' in _p_head160
    or 'undefined' in _p_head160 or\n            'timed out' in _p_head160 or 'connection
    refused' in _p_head160 or\n            'too large' in _p_head160 or 'exceeds'
    in _p_head160 or 'size limit' in _p_head160 or\n            'access is denied'
    in _p_head160 or 'access denied' in _p_head160 or\n            'requires elevation'
    in _p_head160 or 'run as administrator' in _p_head160) -%}\n        {%- set _p_perm
    = (_prc | length < 1000 and (\n            'access is denied' in _prc or 'access
    denied' in _prc or 'permission denied' in _prc or\n            'requires elevation'
    in _prc or 'run as administrator' in _prc or\n            'operation requires'
    in _prc)) -%}\n        {%- if '$ ' not in _prc_raw and 'took ' not in _prc and
    (_p_hard or (_prc | length < 500 and _p_harness) or (_prc | length < 1000 and
    _p_generic) or _p_perm) -%}\n            {%- set _prescan.failures = _prescan.failures
    + 1 -%}\n        {%- else -%}\n            {%- set _prescan.failures = 0 -%}\n
    \       {%- endif -%}\n    {%- endif -%}\n{%- endfor -%}\n{%- set _tools_suspended
    = (_has_tools and _prescan.failures >= fail_halt_after) -%}\n\n{%- set has_sys
    = system_message and system_message.strip() -%}\n{%- if has_sys or _has_tools
    -%}\n    {{- \"<system>\" -}}\n    {%- if has_sys -%}\n        {{- system_message.rstrip()
    -}}\n        {%- if _has_tools -%}{{- \"\\n\\n\" -}}{%- endif -%}\n    {%- endif
    -%}\n    {%- if _has_tools and not _tools_suspended -%}\n        {{- \"### Tools\\n\\n\"
    -}}\n        {{- \"You may call functions to assist with the user query.\\n\"
    -}}\n        {{- \"All available function signatures are listed below:\\n\" -}}\n
    \       {{- \"<available_tools>\\n\" -}}\n        {%- for tool in tools -%}\n
    \           {%- if tool is mapping and tool.function is defined and tool.function
    is not none -%}\n                {%- if tool.function.name is defined and (tool.function.name
    | lower) == 'skill' -%}\n                    {%- set skill_cfg.loader = true -%}\n
    \               {%- endif -%}\n                {%- if tool.function.name is defined
    and ((tool.function.name | lower) == 'task' or (tool.function.name | lower) ==
    'agent') -%}\n                    {%- set ns_deleg.name = tool.function.name -%}\n
    \               {%- endif -%}\n                {{- (tool.function | tojson) ~
    \"\\n\" -}}\n            {%- else -%}\n                {%- if tool is mapping
    and tool.name is defined and tool.name and (tool.name | lower) == 'skill' -%}\n
    \                   {%- set skill_cfg.loader = true -%}\n                {%- endif
    -%}\n                {%- if tool is mapping and tool.name is defined and tool.name
    and ((tool.name | lower) == 'task' or (tool.name | lower) == 'agent') -%}\n                    {%-
    set ns_deleg.name = tool.name -%}\n                {%- endif -%}\n                {{-
    (tool | tojson) ~ \"\\n\" -}}\n            {%- endif -%}\n        {%- endfor -%}\n
    \       {{- \"</available_tools>\\n\\n\" -}}\n        {%- if enable_toolcall_instructions
    -%}\n        {%- if cfg.thinking -%}\n            {%- set tool_instructions -%}\nIf
    you choose to call a function ONLY reply in the following format with NO suffix:\n\n{%-
    if _tool_format == 'json' %}\n\n<tool_call>\n{\"name\": \"function_name\", \"arguments\":
    {\"parameter_1\": \"value_1\", \"parameter_2\": \"value_2\"}}\n</tool_call>\n{%-
    else %}\n\n<tool_call>function_name<arg_key>parameter_1</arg_key><arg_value>value_1</arg_value><arg_key>parameter_2</arg_key><arg_value>value_2</arg_value></tool_call>\n{%-
    endif %}\n\n<IMPORTANT>\nReminder:\n- You can use the <think></think> block to
    plan your next tool call OR to synthesize data and formulate your final response
    to the user.\n- ALL explanation and reasoning MUST be placed strictly inside the
    <think></think> block.\n{%- if _tool_format == 'json' %}\n- Function calls MUST
    follow the specified format: a single JSON object with \"name\" and \"arguments\"
    keys inside <tool_call></tool_call> tags.\n{%- else %}\n- Function calls MUST
    follow the specified format: <tool_call> tags containing <arg_key> and <arg_value>
    pairs.\n{%- endif %}\n- If you choose to call a tool, you MUST output the <tool_call>
    block IMMEDIATELY after thinking, with NO conversational text before it.\n- To
    call multiple functions, output a separate, completely closed <tool_call></tool_call>
    block for EACH function.\n- Take every required argument value from the user request,
    visible repository state, the current tool schema, or a previous tool result.
    If a required value is unknown, inspect first.\n- For edit/write tools, take exact
    file paths and exact replacement strings from visible repository state or prior
    tool output - read the file first if you have not seen its current content.\n-
    Keep working until the user's request is complete: after making a change, verify
    it, then move on to the next step. Prefer small concrete actions over long deliberation
    - when the next step is unclear, take the smallest informative action.\n- End
    your turn when the task is done, you are blocked, you need the user's input, or
    you have reached a meaningful checkpoint worth showing. When you end, state your
    result or progress directly, without a tool call.\n- If you have all necessary
    data, provide your final answer directly to the user without any tool call.\n</IMPORTANT>\n
    \           {%- endset -%}\n        {%- else -%}\n            {%- set tool_instructions
    -%}\nIf you choose to call a function ONLY reply in the following format with
    NO suffix:\n\n{%- if _tool_format == 'json' %}\n\n<tool_call>\n{\"name\": \"function_name\",
    \"arguments\": {\"parameter_1\": \"value_1\", \"parameter_2\": \"value_2\"}}\n</tool_call>\n{%-
    else %}\n\n<tool_call>function_name<arg_key>parameter_1</arg_key><arg_value>value_1</arg_value><arg_key>parameter_2</arg_key><arg_value>value_2</arg_value></tool_call>\n{%-
    endif %}\n\n<IMPORTANT>\nReminder:\n{%- if _tool_format == 'json' %}\n- Function
    calls MUST follow the specified format: a single JSON object with \"name\" and
    \"arguments\" keys inside <tool_call></tool_call> tags.\n{%- else %}\n- Function
    calls MUST follow the specified format: <tool_call> tags containing <arg_key>
    and <arg_value> pairs.\n{%- endif %}\n- If you choose to call a tool, you MUST
    output the <tool_call> block at the very start of your response, with NO conversational
    text before it.\n- To call multiple functions, output a separate, completely closed
    <tool_call></tool_call> block for EACH function.\n- Take every required argument
    value from the user request, visible repository state, the current tool schema,
    or a previous tool result. If a required value is unknown, inspect first.\n- For
    edit/write tools, take exact file paths and exact replacement strings from visible
    repository state or prior tool output - read the file first if you have not seen
    its current content.\n- Keep working until the user's request is complete: after
    making a change, verify it, then move on to the next step. Prefer small concrete
    actions over long deliberation - when the next step is unclear, take the smallest
    informative action.\n- End your turn when the task is done, you are blocked, you
    need the user's input, or you have reached a meaningful checkpoint worth showing.
    When you end, state your result or progress directly, without a tool call.\n-
    If you have all necessary data, provide your final answer directly to the user
    without any tool call.\n</IMPORTANT>\n            {%- endset -%}\n        {%-
    endif -%}\n        {{- tool_instructions | trim -}}\n        {%- endif -%}\n    {%-
    elif _tools_suspended -%}\n        {{- '# Tool Use Suspended\\n\\n' -}}\n        {{-
    'You have encountered ' ~ _prescan.failures ~ ' consecutive tool errors. Tool
    calling has been automatically suspended for this response. You MUST answer in
    plain text only — do NOT attempt to call any tool or produce a <tool_call> block.
    Explain clearly what failed and why the automatic approach cannot succeed, then
    give the user concrete manual steps to resolve the issue.' -}}\n    {%- endif
    -%}\n    {%- if strftime_now is defined -%}\n        {{- '\\n\\nToday is ' + strftime_now('%Y-%m-%d')
    + '.' -}}\n    {%- endif -%}\n    {{- \"</system>\\n\" -}}\n{%- endif -%}\n\n{%-
    set _last_idx = _msgs | length - 1 -%}\n{%- set _long_ctx_threshold = 50 -%}\n{%-
    set ctx = namespace(multi_step_tool=true, last_query_index=_last_idx) -%}\n{%-
    for message in _msgs[::-1] -%}\n    {%- set index = (_msgs | length - 1) - loop.index0
    -%}\n    {%- if ctx.multi_step_tool and message.role == 'user' -%}\n        {%-
    set _rc = render_content(message.content, false) | trim -%}\n        {%- if not
    (_rc.startswith('<tool_response>') and _rc.endswith('</tool_response>')) -%}\n
    \           {%- set ctx.multi_step_tool = false -%}\n            {%- set ctx.last_query_index
    = index -%}\n        {%- endif -%}\n    {%- endif -%}\n{%- endfor -%}\n{%- if
    ctx.multi_step_tool -%}\n    {%- if _last_idx > _long_ctx_threshold -%}\n        {%-
    set ctx.last_query_index = _last_idx -%}\n    {%- else -%}\n        {%- set ctx.last_query_index
    = 0 -%}\n    {%- endif -%}\n{%- endif -%}\n\n{%- set loop_state = namespace(prev_role='',
    consecutive_failures=0, last_tool_permission_error=false, sig1='', sig2='', repeat_count=0,
    sig_repeat=0, prev1='', prev2='', result_repeat=0, last_tool='', tool_ids='',
    skill_checkpoint_sent=false, loaded_skills=' ', loaded_skill_list='') -%}\n\n{#-
    ───── main loop ───── -#}\n{%- for message in _msgs -%}\n    {#- BACKPORT (v21):
    treat a mid-conversation developer message as a system message\n       (folded
    into <system>) instead of letting it fall through to the generic role branch.
    -#}\n    {%- set is_system = (message.role == \"system\" or message.role == \"developer\")
    -%}\n    {%- set content = render_content(message.content, is_system) | trim -%}\n
    \   {%- if is_system -%}\n        {%- if '<|think_off|>' in content -%}\n            {%-
    set cfg.thinking = false -%}\n            {%- set content = content.split('<|think_off|>')
    | join('') | trim -%}\n        {%- elif '<|think_on|>' in content -%}\n            {%-
    set cfg.thinking = true -%}\n            {%- set content = content.split('<|think_on|>')
    | join('') | trim -%}\n        {%- endif -%}\n        {{- \"<system>\" + content
    + \"</system>\\n\" -}}\n    {%- elif message.role == \"user\" -%}\n        {%-
    if '<|think_off|>' in content -%}\n            {%- set content = content.split('<|think_off|>')
    | join('') | trim -%}\n        {%- endif -%}\n        {%- if '<|think_on|>' in
    content -%}\n            {%- set content = content.split('<|think_on|>') | join('')
    | trim -%}\n        {%- endif -%}\n        {%- set loop_state.consecutive_failures
    = 0 -%}\n        {%- set loop_state.last_tool_permission_error = false -%}\n        {%-
    set loop_state.sig1 = '' -%}\n        {%- set loop_state.sig2 = '' -%}\n        {%-
    set loop_state.repeat_count = 0 -%}\n        {%- set loop_state.sig_repeat = 0
    -%}\n        {%- set loop_state.prev1 = '' -%}\n        {%- set loop_state.prev2
    = '' -%}\n        {%- set loop_state.result_repeat = 0 -%}\n        {%- set loop_state.last_tool
    = '' -%}\n        {%- set loop_state.tool_ids = '' -%}\n        {%- set _user_envelope
    = (content.startswith('<tool_response>') and content.endswith('</tool_response>'))
    or content.startswith('Attached media from tool result:') -%}\n        {%- if
    skill_cfg.loader and not _user_envelope and not loop_state.skill_checkpoint_sent
    -%}\n            {%- set content = content + '\\n\\nSYSTEM CHECKPOINT:\\nSkill
    selection and loading is the first tool phase. Make one complete pass over the
    distinct work types in the task (languages, platforms, failure domains, security
    surfaces, and requested deliverables) against the available skill descriptions
    before planning, delegation, research, memory access, or any other tool call.
    Finding one match does not end comparison.\\n\\nComplete the match set first:
    any description that says to load for this kind of task belongs in the set. Then
    emit one skill call for every set member together in the same skill-only response.
    Wait for every result, then combine and apply their guidance before continuing.\\n\\nReserve
    skill loading for direct matches; weak or incidental relationships are insufficient.'
    ~ ('\\n\\nSequence the opening phases: complete the skill-only response and wait
    for every selected skill result. After combining their guidance, make one delegation
    pass before planning the main work: name every part of this task that could run
    on its own - background research, independent exploration, or isolated verification.
    Listing them is the step to complete here; a task that reads as one piece often
    hides several. Hand each named part to the ' ~ ns_deleg.name ~ ' tool, in parallel
    where possible, and keep only the work that depends on your ongoing changes in
    this session.' if ns_deleg.name else '') -%}\n            {%- set loop_state.skill_checkpoint_sent
    = true -%}\n        {%- elif skill_cfg.loader and not _user_envelope -%}\n            {%-
    set content = content ~ '\\n\\nSYSTEM CHECKPOINT - CONTINUATION:\\nPreviously
    loaded skills: ' ~ (loop_state.loaded_skill_list if loop_state.loaded_skill_list
    else 'none') ~ '.\\n\\nContinue applying any guidance listed above to the same
    work. When this request adds a distinct work type or exposes a new direct match,
    complete the match set from the remaining available skills and load every member
    together in one skill-only response before any other tool.\\n\\nReserve skill
    loading for direct matches; weak or incidental relationships are insufficient.'
    -%}\n        {%- endif -%}\n        {{- \"<user>\" + content + \"</user>\\n\"
    -}}\n    {%- elif message.role == \"assistant\" -%}\n        {%- generation -%}\n
