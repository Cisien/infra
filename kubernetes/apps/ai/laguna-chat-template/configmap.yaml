    privileges (Access Denied). I cannot execute elevated commands directly. I should
    provide the necessary commands to the user and instruct them to run these manually
    as Administrator. Let me formulate the exact commands they need to run.\\n' -}}\n
    \       {%- else -%}\n            {{- '<think>The previous tool calls failed repeatedly.
    Diagnose the root cause before retrying with a fundamentally different approach.\\n'
    -}}\n        {%- endif -%}\n    {%- elif loop_state.repeat_count >= repeat_halt_after
    -%}\n        {{- '<think>I have called the same tool with the same arguments '
    ~ loop_state.repeat_count ~ ' times in a row and gotten the same result every
    time. Repeating it again is pointless. I will stop and explain the situation to
    the user.</think>I have tried the same action ' ~ loop_state.repeat_count ~ '
    times and it keeps producing the same result. Here is what is happening and what
    to try instead:\\n\\n' -}}\n    {%- elif loop_state.repeat_count >= repeat_warn_after
    -%}\n        {{- '<think>My last call was identical to one of the two before it
    (same tool, same arguments) and returned the same result. Repeating it again will
    not change anything — let me pick a genuinely different next step.\\n' -}}\n    {%-
    else -%}\n        {{- '<think>' -}}\n    {%- endif -%}\n{%- endif -%}\n"
kind: ConfigMap
metadata:
  name: laguna-chat-template
  namespace: ai
