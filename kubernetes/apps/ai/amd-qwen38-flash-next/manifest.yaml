apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-qwen38-flash-next
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-qwen38-flash-next
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-qwen38-flash-next
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        ai.cisien.com/vendor: amd
      tolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      resourceClaims:
        - name: amd-gpu
          resourceClaimName: shared-amd-gpu
      imagePullSecrets:
        - name: oci-registry-pull
      containers:
        - name: llama-server
          image: registry.cisien.com/ai-runtime/engramhalo-qwen38-flash-next@sha256:b94bbf00954fa7af6c81b72fbb05d9429719c3cadafaa846cf23bf0991825ee8
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -hf
            - unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ3_XXS
            - --alias
            - robot
            - --jinja
            - --no-webui
            - --n-gpu-layers
            - "999"
            - --flash-attn
            - "on"
            - --ctx-size
            - "262144"
            - --parallel
            - "1"
            - --batch-size
            - "8192"
            - --ubatch-size
            - "2048"
            - --threads
            - "4"
            - --load-mode
            - mmap
            - --tensor-read-lazy
            - "on"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --temp
            - "1.0"
            - --min-p
            - "0.0"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --repeat-penalty
            - "1.0"
            - --presence-penalty
            - "0.0"
            - --reasoning
            - "on"
            - --reasoning-preserve
            - --reasoning-format
            - deepseek
            - --chat-template-kwargs
            - '{"preserve_thinking":true}'
            - --image-min-tokens
            - "1024"
            - --spec-type
            - draft-mtp,ngram-mod
            - --spec-draft-hf
            - EasiiX/Qwen3.8-Flash-Next-MTP-Strix-Halo-GGUF:Q8_0
            - --spec-draft-n-max
            - "4"
            - --spec-draft-p-min
            - "0.75"
            - --metrics
          env:
            - name: LLAMA_CACHE
              value: /models
            - name: HIP_VISIBLE_DEVICES
              value: "0"
            - name: ROCR_VISIBLE_DEVICES
              value: "0"
            - name: ROCBLAS_USE_HIPBLASLT
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "16"
              memory: 120Gi
            limits:
              cpu: "16"
              memory: 120Gi
            claims:
              - name: amd-gpu
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 360
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: amd-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: amd-qwen38-flash-next
  namespace: ai
  labels:
    metrics: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: amd-qwen38-flash-next
  ports:
    - name: http
      port: 8080
      targetPort: http
