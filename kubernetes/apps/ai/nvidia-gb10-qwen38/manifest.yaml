apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nvidia-gb10-model-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ai-local
  volumeName: ai-nvidia-02-data
  resources:
    requests:
      storage: 800Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvidia-gb10-qwen38
  namespace: ai
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-gb10-qwen38
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-gb10-qwen38
    spec:
      nodeSelector:
        ai.cisien.com/accelerator: gb10
      tolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: vllm
          image: eugr/spark-vllm@sha256:19d2158d320ca4c8704ebf56990de2a40b71055d6d7a5a6829a877db6a1e9125
          args:
            - vllm
            - serve
            - RadixArk/Qwen3.8-27B-NVFP4
            - --revision
            - 319f741cce68d7914884900c138a1fbb70a42f30
            - --served-model-name
            - competent-robot
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --max-model-len
            - "262144"
            - --max-num-seqs
            - "4"
            - --gpu-memory-utilization
            - "0.90"
            - --trust-remote-code
            - --enable-prefix-caching
            - --speculative-config
            - '{"method":"dspark","model":"RadixArk/Qwen3.8-27B-DSpark","num_speculative_tokens":13}'
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_xml
            - --reasoning-parser
            - qwen3
            - --default-chat-template-kwargs
            - '{"reasoning_effort":"low","preserve_thinking":true}'
            - --override-generation-config
            - '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}'
          env:
            - name: HF_HOME
              value: /models/huggingface
            - name: VLLM_CACHE_ROOT
              value: /models/vllm
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu.shared: 1
            limits:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu.shared: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 360
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: nvidia-gb10-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-gb10-qwen38
  namespace: ai
  labels:
    metrics: vllm
spec:
  selector:
    app.kubernetes.io/name: nvidia-gb10-qwen38
  ports:
    - name: http
      port: 8080
      targetPort: http
