apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-dspark-220k
  namespace: ai
  labels:
    app.kubernetes.io/name: qwen38-performance-benchmark
    app.kubernetes.io/part-of: qwen38-dspark-experiment
    benchmark.cisien.com/variant: dspark
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen38-performance-benchmark
        benchmark.cisien.com/variant: dspark
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: python:3.12-slim
          command: ["python3", "/scripts/benchmark.py", "--api-base", "http://nvidia-gb10-qwen38-dspark.ai.svc.cluster.local:8080", "--model", "competent-robot-dspark", "--sizes", "220000", "--generation-tokens", "128", "--output", "/tmp/results.json"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: qwen38-performance-benchmark-script
