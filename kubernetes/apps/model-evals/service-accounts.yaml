apiVersion: v1
kind: ServiceAccount
metadata:
  name: candidate-server
  namespace: model-evals
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluator
  namespace: model-evals
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evaluator-read-own-workloads
  namespace: model-evals
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evaluator-read-own-workloads
  namespace: model-evals
subjects:
  - kind: ServiceAccount
    name: evaluator
    namespace: model-evals
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evaluator-read-own-workloads
