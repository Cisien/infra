apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: model-evals
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evaluator-egress
  namespace: model-evals
spec:
  podSelector:
    matchLabels:
      model-evals.cisien.com/role: evaluator
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              model-evals.cisien.com/role: candidate
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: candidate-ingress
  namespace: model-evals
spec:
  podSelector:
    matchLabels:
      model-evals.cisien.com/role: candidate
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              model-evals.cisien.com/role: evaluator
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
