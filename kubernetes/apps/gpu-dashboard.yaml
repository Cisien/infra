apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: gpu-monitoring
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana
  title: GPU Monitoring
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gpu-workers
  namespace: monitoring
spec:
  folderRef: gpu-monitoring
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana
  json: |
    {
      "annotations": {"list": []},
      "description": "Metrics for the dedicated NVIDIA and AMD Talos GPU workers.",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 4, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "up{namespace=\"nvidia-gpu-operator\", service=\"nvidia-dcgm-exporter\"}", "refId": "A"}],
          "title": "NVIDIA DCGM exporter target",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "up{namespace=\"amd-gpu-operator\", service=\"default-metrics-exporter\"}", "refId": "A"}],
          "title": "AMD metrics exporter target",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 3,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "DCGM_FI_DEV_GPU_UTIL{Hostname=\"ai-nvidia-01\"}", "legendFormat": "GPU {{gpu}}", "refId": "A"}],
          "title": "NVIDIA GPU utilization",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "decmbytes", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "id": 4,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "DCGM_FI_DEV_FB_USED{Hostname=\"ai-nvidia-01\"}", "legendFormat": "GPU {{gpu}} used", "refId": "A"}],
          "title": "NVIDIA framebuffer used",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "celsius", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": [{"matcher": {"id": "byName", "options": "Power"}, "properties": [{"id": "unit", "value": "watt"}]}]},
          "id": 5,
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "DCGM_FI_DEV_GPU_TEMP{Hostname=\"ai-nvidia-01\"}", "legendFormat": "Temperature", "refId": "A"}, {"expr": "DCGM_FI_DEV_POWER_USAGE{Hostname=\"ai-nvidia-01\"}", "legendFormat": "Power", "refId": "B"}],
          "title": "NVIDIA temperature and power",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "id": 6,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "max by (hostname, gpu_id) (gpu_gfx_activity{hostname=\"ai-amd-01\"})", "legendFormat": "GPU {{gpu_id}}", "refId": "A"}],
          "title": "AMD graphics activity",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "celsius", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": [{"matcher": {"id": "byName", "options": "Power GPU 0"}, "properties": [{"id": "unit", "value": "watt"}]}]},
          "id": 7,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "max by (hostname, gpu_id) (gpu_average_package_power{hostname=\"ai-amd-01\"})", "legendFormat": "Power GPU {{gpu_id}}", "refId": "A"}, {"expr": "node_hwmon_temp_celsius{instance=\"172.16.200.106:9100\"} * on (instance, chip) group_left(chip_name) node_hwmon_chip_names{instance=\"172.16.200.106:9100\", chip_name=\"amdgpu\"}", "legendFormat": "Temperature {{sensor}}", "refId": "B"}],
          "title": "AMD temperature and package power",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "decmbytes", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "id": 8,
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "max by (hostname, gpu_id) (gpu_used_vram{hostname=\"ai-amd-01\"})", "legendFormat": "Used GPU {{gpu_id}}", "refId": "A"}, {"expr": "max by (hostname, gpu_id) (gpu_free_vram{hostname=\"ai-amd-01\"})", "legendFormat": "Free GPU {{gpu_id}}", "refId": "B"}],
          "title": "AMD memory utilization",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["gpu", "nvidia", "amd", "talos"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "GPU Workers",
      "uid": "gpu-workers",
      "version": 1
    }
