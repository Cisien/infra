apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-laguna
  namespace: ai
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-laguna
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-laguna
    spec:
      nodeSelector:
        ai.cisien.com/vendor: amd
      tolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      resourceClaims:
        - name: amd-gpu
          resourceClaimName: shared-amd-gpu
      imagePullSecrets:
        - name: oci-registry-pull
      initContainers:
        - name: model-cache
          image: ghcr.io/oras-project/oras:v1.3.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cache=/models/laguna-fp4
              complete="$cache/.complete"
              if test -f "$complete"; then exit 0; fi
              tmp=$(mktemp -d /models/.laguna-fp4.XXXXXX)
              trap 'rm -rf "$tmp"' EXIT
              oras pull --username "$OCI_USERNAME" --password "$OCI_PASSWORD" --output "$tmp" registry.cisien.com/ai-models/laguna-fp4:2026-08-10
              test -f "$tmp/laguna-s-2.1-ROCmFP4-StrixKVSpine-v4.gguf"
              rm -rf "$cache"
              mv "$tmp" "$cache"
              touch "$complete"
          env:
            - name: OCI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oci-registry-client
                  key: username
            - name: OCI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-registry-client
                  key: password
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: registry.cisien.com/ai-runtime/llama-rocmfpx-laguna:2026.08.10
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --model
            - /models/laguna-fp4/laguna-s-2.1-ROCmFP4-StrixKVSpine-v4.gguf
            - --alias
            - robot-laguna
            - --jinja
            - --chat-template-file
            - /opt/llama/laguna-s-2.1-chat-template.jinja
            - --ctx-size
            - "524288"
            - --parallel
            - "2"
            - --n-gpu-layers
            - "999"
            - --device
            - Vulkan0
            - --split-mode
            - row
            - --flash-attn
            - "on"
            - --cache-type-k
            - f16
            - --cache-type-v
            - f16
            - --batch-size
            - "2048"
            - --ubatch-size
            - "512"
            - --threads
            - "16"
            - --threads-batch
            - "16"
            - --temp
            - "1.0"
            - --top-p
            - "1.0"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --repeat-penalty
            - "1.0"
            - --seed
            - "42"
            - --chat-template-kwargs
            - '{"enable_thinking":true,"preserve_thinking":true}'
            - --reasoning
            - "on"
            - --reasoning-format
            - deepseek
            - --reasoning-budget
            - "-1"
            - --no-mmproj
            - --spec-type
            - none
            - --metrics
          env:
            - name: GGML_VK_MAX_NODES_PER_SUBMIT
              value: "10"
            - name: GGML_VK_FA_MAX_WORKGROUPS_X_PER_DISPATCH
              value: "4"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
            limits:
              cpu: "16"
              memory: 64Gi
            claims:
              - name: amd-gpu
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 180
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: chat-template
              mountPath: /opt/llama/laguna-s-2.1-chat-template.jinja
              subPath: laguna-s-2.1-chat-template.jinja
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: amd-model-cache
        - name: chat-template
          configMap:
            name: laguna-chat-template
---
