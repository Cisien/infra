apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nvidia-model-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ai-local
  volumeName: ai-nvidia-01-data
  resources:
    requests:
      storage: 1200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: amd-model-cache
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ai-local
  volumeName: ai-amd-01-data
  resources:
    requests:
      storage: 1200Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      - model_name: incompetent-robot
        litellm_params:
          model: openai/incompetent-robot
          api_base: http://nvidia-qwen38.ai.svc.cluster.local:8080/v1
          api_key: none

      - model_name: competent-robot
        litellm_params:
          model: openai/competent-robot
          api_base: http://nvidia-gb10-qwen38.ai.svc.cluster.local:8080/v1
          api_key: none

      - model_name: robot
        litellm_params:
          model: openai/robot
          api_base: http://amd-qwen38.ai.svc.cluster.local:8080/v1
          api_key: none

      - model_name: gemma-classifier
        litellm_params:
          model: openai/gemma-classifier
          api_base: http://amd-gemma.ai.svc.cluster.local:8080/v1
          api_key: none

    litellm_settings:
      drop_params: true
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      annotations:
        config.cisien.com/litellm-config: "aliased-models-only-v5-gb10"
      labels:
        app.kubernetes.io/name: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.96.0
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-auth
                  key: master-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-database
                  key: DATABASE_URL
            - name: STORE_MODEL_IN_DB
              value: "True"
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvidia-qwopus
  namespace: ai
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-qwopus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-qwopus
    spec:
      nodeSelector:
        ai.cisien.com/vendor: nvidia
      tolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      initContainers:
        - name: model-cache
          image: ghcr.io/oras-project/oras:v1.3.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cache=/models/qwopus-q6
              complete="$cache/.complete"
              if test -f "$complete"; then exit 0; fi
              tmp=$(mktemp -d /models/.qwopus-q6.XXXXXX)
              trap 'rm -rf "$tmp"' EXIT
              oras pull --username "$OCI_USERNAME" --password "$OCI_PASSWORD" --output "$tmp" registry.cisien.com/ai-models/qwopus-q6:2026-08-11-r2
              test -f "$tmp/Qwopus3.6-27B-v2-MTP-Q6_K.gguf"
              rm -rf "$cache"
              mv "$tmp" "$cache"
              touch "$complete"
          env:
            - name: OCI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oci-registry-client
                  key: username
            - name: OCI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-registry-client
                  key: password
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          args:
            - --host
            - 0.0.0.0
            - --parallel
            - "1"
            - --model
            - /models/qwopus-q6/Qwopus3.6-27B-v2-MTP-Q6_K.gguf
            - --jinja
            - -c
            - "262144"
            - --fit
            - "off"
            - --no-mmap
            - --temp
            - "1"
            - --min-p
            - "0.01"
            - --top-p
            - "0.95"
            - --top-k
            - "65"
            - --alias
            - incompetent-robot
            - --threads
            - "18"
            - --flash-attn
            - "on"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --metrics
            - --cache-ram
            - "32768"
            - --spec-draft-n-max
            - "3"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "18"
              memory: 40Gi
              nvidia.com/gpu: 2
            limits:
              cpu: "18"
              memory: 40Gi
              nvidia.com/gpu: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 180
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: nvidia-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-qwopus
  namespace: ai
  labels:
    metrics: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: nvidia-qwopus
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-qwen
  namespace: ai
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-qwen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-qwen
    spec:
      nodeSelector:
        ai.cisien.com/vendor: amd
      tolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      resourceClaims:
        - name: amd-gpu
          resourceClaimName: shared-amd-gpu
      imagePullSecrets:
        - name: oci-registry-pull
      initContainers:
        - name: model-cache
          image: ghcr.io/oras-project/oras:v1.3.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cache=/models/qwen-mtp
              complete="$cache/.complete"
              if test -f "$complete"; then exit 0; fi
              tmp=$(mktemp -d /models/.qwen-mtp.XXXXXX)
              trap 'rm -rf "$tmp"' EXIT
              oras pull --username "$OCI_USERNAME" --password "$OCI_PASSWORD" --output "$tmp" registry.cisien.com/ai-models/qwen-27b-mtp-rocmfp4:2026-08-11-r1
              test -f "$tmp/Qwen3.6-27B-MTP-ROCmFP4-STRIX-imatrix-embF16-headQ6.gguf"
              test -f "$tmp/mmproj-F32.gguf"
              test -f "$tmp/chat_template.jinja"
              test -f "$tmp/qwen3.6-27b-code.imatrix"
              rm -rf "$cache"
              mv "$tmp" "$cache"
              touch "$complete"
          env:
            - name: OCI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oci-registry-client
                  key: username
            - name: OCI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-registry-client
                  key: password
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: registry.cisien.com/ai-runtime/llama-rocmfpx-qwen-mtp:2026.08.11-r1
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --model
            - /models/qwen-mtp/Qwen3.6-27B-MTP-ROCmFP4-STRIX-imatrix-embF16-headQ6.gguf
            - --alias
            - robot
            - -dev
            - Vulkan0
            - -ngl
            - "999"
            - -fa
            - on
            - -c
            - "262144"
            - -b
            - "2048"
            - -ub
            - "256"
            - -t
            - "16"
            - -tb
            - "16"
            - -ctk
            - f16
            - -ctv
            - f16
            - -cpent
            - "256"
            - -ctxcp
            - "32"
            - --cache-reuse
            - "256"
            - --cache-ram
            - "65536"
            - --temp
            - "0.6"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --spec-type
            - draft-mtp
            - --spec-draft-device
            - Vulkan0
            - --spec-draft-ngl
            - all
            - --spec-draft-type-k
            - f16
            - --spec-draft-type-v
            - f16
            - --spec-draft-n-max
            - "5"
            - --spec-draft-n-min
            - "0"
            - --spec-draft-p-min
            - "0.0"
            - --spec-draft-p-split
            - "0.10"
            - --chat-template-file
            - /models/qwen-mtp/chat_template.jinja
            - --reasoning
            - "on"
            - --reasoning-format
            - deepseek
            - --chat-template-kwargs
            - '{"preserve_thinking":true}'
            - --jinja
            - --parallel
            - "1"
            - --metrics
            - --no-mmap
            - --mmproj
            - /models/qwen-mtp/mmproj-F32.gguf
            - --image-min-tokens
            - "1024"

          env:
            - name: HIP_VISIBLE_DEVICES
              value: "0"
            - name: ROCR_VISIBLE_DEVICES
              value: "0"
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "11.5.1"
            - name: GGML_HIP_ENABLE_UNIFIED_MEMORY
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
            limits:
              cpu: "16"
              memory: 64Gi
            claims:
              - name: amd-gpu
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 180
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: amd-model-cache
---
