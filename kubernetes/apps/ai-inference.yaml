kind: Service
metadata:
  name: amd-qwen
  namespace: ai
  labels:
    metrics: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: amd-qwen
  ports:
    - name: http
      port: 8080
      targetPort: http
