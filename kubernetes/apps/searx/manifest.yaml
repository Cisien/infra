apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: searx
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-nfs
  resources:
    requests:
      # Set this to at least the measured source volume size before migration.
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: searx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.0-alpine3.23
          volumeMounts:
            # The Swarm Redis volume is tmpfs. Keep it non-persistent.
            - name: data
              mountPath: /var/lib/redis
      volumes:
        - name: data
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: searx
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:2026.8.4-c63835bd2
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: https://search.cisien.dev/
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: searx
spec:
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: search
  namespace: searx
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - search.cisien.dev
  rules:
    - backendRefs:
        - name: searxng
          port: 8080
