# These resources preserve routes whose upstream does not run in Portainer.
# Home Assistant rejects untrusted X-Forwarded-For headers from a new proxy, so
# its in-cluster NGINX proxy strips those headers before the external hop.
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-upstream
  namespace: external-services
spec:
  ports:
    - name: http
      port: 8123
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-upstream
  namespace: external-services
  labels:
    kubernetes.io/service-name: home-assistant-upstream
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8123
endpoints:
  - addresses:
      - 192.168.1.111
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-proxy-nginx
  namespace: external-services
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        proxy_pass http://home-assistant-upstream:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant-proxy
  namespace: external-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.3-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: home-assistant-proxy-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: external-services
spec:
  selector:
    app.kubernetes.io/name: home-assistant-proxy
  ports:
    - name: http
      port: 8123
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: external-services
spec:
  ports:
    - name: http
      port: 11000
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nextcloud
  namespace: external-services
  labels:
    kubernetes.io/service-name: nextcloud
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 11000
endpoints:
  - addresses:
      - 172.16.0.253
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: external-services
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - ha.cisien.com
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: external-services
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - cloud.cisien.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/carddav
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: cloud.cisien.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /remote.php/dav
            statusCode: 301
    - matches:
        - path:
            type: Exact
            value: /.well-known/caldav
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: cloud.cisien.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /remote.php/dav
            statusCode: 301
    - backendRefs:
        - name: nextcloud
          port: 11000
