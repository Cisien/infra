apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvidia-gb10-qwen38-dspark
  namespace: ai
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-gb10-qwen38-dspark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-gb10-qwen38-dspark
    spec:
      nodeSelector:
        ai.cisien.com/accelerator: gb10
      tolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: vllm
          image: eugr/spark-vllm:latest
          args:
            - vllm
            - serve
            - RadixArk/Qwen3.8-27B-NVFP4
            - --served-model-name
            - competent-robot-dspark
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --max-model-len
            - "262144"
            - --max-num-seqs
            - "4"
            - --gpu-memory-utilization
            - "0.90"
            - --trust-remote-code
            - --enable-prefix-caching
            - --speculative-config
            - '{"method":"dspark","model":"RadixArk/Qwen3.8-27B-DSpark","num_speculative_tokens":7}'
            - --reasoning-parser
            - qwen3
            - --tool-call-parser
            - qwen3_xml
            - --enable-auto-tool-choice
          env:
            - name: HF_HOME
              value: /models/huggingface
            - name: VLLM_CACHE_ROOT
              value: /models/vllm
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu.shared: 1
            limits:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu.shared: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 360
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: nvidia-gb10-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-gb10-qwen38-dspark
  namespace: ai
  labels:
    metrics: vllm
spec:
  selector:
    app.kubernetes.io/name: nvidia-gb10-qwen38-dspark
  ports:
    - name: http
      port: 8080
      targetPort: http
