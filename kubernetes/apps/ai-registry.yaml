apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oci-registry-data
  namespace: ai
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nas-nfs
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-registry
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oci-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oci-registry
    spec:
      # The NFS export is reachable from base-workers-hzj89. The matching
      # mount attempt from base-workers-x8qpm currently stalls before the
      # container can start, so keep this singleton on the verified node.
      nodeSelector:
        kubernetes.io/hostname: base-workers-hzj89
      containers:
        - name: registry
          image: registry:3.0.0
          ports:
            - name: registry
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_HTTP_ADDR
              value: 0.0.0.0:5000
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: oci-registry-auth
                  key: http-secret
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: OCI Registry
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            - name: REGISTRY_TRACING_ENABLED
              value: "false"
          startupProbe:
            tcpSocket:
              port: registry
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: auth
              mountPath: /auth
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oci-registry-data
        - name: auth
          secret:
            secretName: oci-registry-auth
            items:
              - key: htpasswd
                path: htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: oci-registry
  namespace: ai
spec:
  selector:
    app.kubernetes.io/name: oci-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oci-registry
  namespace: ai
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - registry.cisien.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v2
      backendRefs:
        - name: oci-registry
          port: 5000
