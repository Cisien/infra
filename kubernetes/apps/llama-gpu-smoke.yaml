apiVersion: v1
kind: Namespace
metadata:
  name: gpu-smoke
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cuda-smoke
  namespace: gpu-smoke
spec:
  selector:
    app.kubernetes.io/name: llama-cuda-smoke
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cuda-smoke
  namespace: gpu-smoke
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cuda-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cuda-smoke
    spec:
      nodeSelector:
        ai.cisien.com/vendor: nvidia
      tolerations:
        - key: ai.cisien.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      initContainers:
        - name: model-download
          image: curlimages/curl:8.15.0
          args:
            - --fail
            - --location
            - --retry
            - "5"
            - --output
            - /models/model.gguf
            - https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          volumeMounts:
            - name: model
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          args:
            - --model
            - /models/model.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "512"
            - --n-gpu-layers
            - "999"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: model
          emptyDir: {}
---
