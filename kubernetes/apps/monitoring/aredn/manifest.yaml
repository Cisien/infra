apiVersion: v1
kind: Service
metadata:
  name: aredn-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: aredn-metrics
spec:
  ports:
    - name: metrics
      port: 80
      protocol: TCP
---
# Prometheus v0.93 discovers ServiceMonitor endpoints through the legacy
# Endpoints API. Keep this explicit record with the EndpointSlice below.
apiVersion: v1
kind: Endpoints
metadata:
  name: aredn-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: aredn-metrics
subsets:
  - addresses:
      - ip: 10.178.191.209
    ports:
      - name: metrics
        port: 80
        protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: aredn-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: aredn-metrics
    kubernetes.io/service-name: aredn-metrics
addressType: IPv4
ports:
  - name: metrics
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - 10.178.191.209
    conditions:
      ready: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aredn-metrics
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aredn-metrics
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      path: /cgi-bin/metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: amateur-radio
  namespace: monitoring
spec:
  title: Amateur Radio
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana
---
apiVersion: grafana.integreatly.org/v1beta1
