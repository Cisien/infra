apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-cpp
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - ai
  selector:
    matchLabels:
      metrics: llama-cpp
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: llama-cpp-monitoring
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana
  title: llama.cpp Monitoring
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: llama-cpp-slots
  namespace: monitoring
spec:
  folderRef: llama-cpp-monitoring
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana
  json: |
    {
      "annotations": {"list": []},
      "description": "Aggregate llama.cpp server and slot activity metrics.",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Requests processing", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "llamacpp:requests_processing", "legendFormat": "{{job}} / {{service}}", "refId": "A"}]},
        {"id": 2, "type": "timeseries", "title": "Requests deferred", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "llamacpp:requests_deferred", "legendFormat": "{{job}} / {{service}}", "refId": "A"}]},
        {"id": 3, "type": "timeseries", "title": "Busy slots per decode", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "llamacpp:n_busy_slots_per_decode", "legendFormat": "{{job}} / {{service}}", "refId": "A"}]},
        {"id": 4, "type": "timeseries", "title": "Prompt throughput", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "llamacpp:prompt_tokens_seconds", "legendFormat": "{{service}}", "refId": "A"}]},
        {"id": 9, "type": "timeseries", "title": "Generation throughput", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "llamacpp:predicted_tokens_seconds", "legendFormat": "{{service}}", "refId": "A"}]},
        {"id": 8, "type": "stat", "title": "Active llama.cpp targets", "gridPos": {"h": 4, "w": 12, "x": 12, "y": 16}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(up{namespace=\"ai\", service=~\"amd-qwen38|amd-gemma|nvidia-qwen38\"} == 1)", "refId": "A"}]}
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["llama.cpp", "inference", "slots"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "llama.cpp Slots",
      "uid": "llama-cpp-slots",
      "version": 1
    }
