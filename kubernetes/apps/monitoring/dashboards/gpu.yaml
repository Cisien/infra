apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: ai-hosts-monitoring
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana
  title: AI Hosts
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ai-hosts
  namespace: monitoring
spec:
  folderRef: ai-hosts-monitoring
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana
  json: |
    {
      "annotations": {"list": []},
      "description": "Inference throughput and host resources for AI workers. Prompt and generation throughput, CPU and GPU utilization, and CPU and GPU temperature use separate panels.",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (node) ((rate(vllm:prompt_tokens_total[5m]) * on (namespace, pod) group_left(node) kube_pod_info) or (llamacpp:prompt_tokens_seconds * on (namespace, pod) group_left(node) kube_pod_info))", "legendFormat": "{{node}}", "refId": "A"}],
          "title": "Prompt processing throughput by host",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (node) ((rate(vllm:generation_tokens_total[5m]) * on (namespace, pod) group_left(node) kube_pod_info) or (llamacpp:predicted_tokens_seconds * on (namespace, pod) group_left(node) kube_pod_info))", "legendFormat": "{{node}}", "refId": "A"}],
          "title": "Token generation throughput by host",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "(1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))) * on (instance) group_left(nodename) max by (instance, nodename) (node_uname_info{nodename=~\"ai-(amd|nvidia)-.*\"})", "legendFormat": "{{nodename}}", "refId": "A"}],
          "title": "CPU utilization by host",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "max": 100, "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "max by (Hostname, gpu) (DCGM_FI_DEV_GPU_UTIL)", "legendFormat": "{{Hostname}} GPU {{gpu}}", "refId": "A"}, {"expr": "max by (hostname, gpu_id) (gpu_gfx_activity)", "legendFormat": "{{hostname}} GPU {{gpu_id}}", "refId": "B"}],
          "title": "GPU utilization by host",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 5,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) * on (instance) group_left(nodename) max by (instance, nodename) (node_uname_info{nodename=~\"ai-(amd|nvidia)-.*\"})", "legendFormat": "{{nodename}} used", "refId": "A"}],
          "title": "System memory used by host",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 6,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "max by (Hostname, gpu) (DCGM_FI_DEV_FB_USED * 1024 * 1024)", "legendFormat": "{{Hostname}} GPU {{gpu}} framebuffer", "refId": "A"}, {"expr": "max by (hostname, gpu_id) ((gpu_total_gtt - gpu_free_gtt) * 1000000)", "legendFormat": "{{hostname}} GPU {{gpu_id}} unified", "refId": "B"}],
          "title": "GPU memory used by host",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "celsius", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "id": 7,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "(node_hwmon_temp_celsius * on (instance, chip) group_left(chip_name) node_hwmon_chip_names{chip_name=\"k10temp\"}) * on (instance) group_left(nodename) max by (instance, nodename) (node_uname_info{nodename=~\"ai-(amd|nvidia)-.*\"})", "legendFormat": "{{nodename}} CPU {{sensor}}", "refId": "A"}, {"expr": "node_thermal_zone_temp{type=\"acpitz\"} * on (instance) group_left(nodename) max by (instance, nodename) (node_uname_info{nodename=~\"ai-(amd|nvidia)-.*\"})", "legendFormat": "{{nodename}} CPU zone {{zone}}", "refId": "B"}],
          "title": "CPU temperature by host",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "celsius", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "id": 8,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "max by (Hostname, gpu) (DCGM_FI_DEV_GPU_TEMP)", "legendFormat": "{{Hostname}} GPU {{gpu}}", "refId": "A"}, {"expr": "max by (nodename) ((node_hwmon_temp_celsius * on (instance, chip) group_left(chip_name) node_hwmon_chip_names{chip_name=\"amdgpu\"}) * on (instance) group_left(nodename) node_uname_info{nodename=\"ai-amd-01\"})", "legendFormat": "{{nodename}} GPU", "refId": "B"}],
          "title": "GPU temperature by host",
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["ai", "inference", "gpu", "host"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "AI Hosts",
      "uid": "ai-hosts",
      "version": 1
    }