apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - ai
  selector:
    matchLabels:
      metrics: vllm
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: vllm-monitoring
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana
  title: vLLM Monitoring
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: vllm-inference
  namespace: monitoring
spec:
  folderRef: vllm-monitoring
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana
  json: |
    {
      "annotations": {"list": []},
      "description": "vLLM engine load, throughput, latency, and KV/prefix cache activity.",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Running and waiting requests", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "vllm:num_requests_running", "legendFormat": "{{service}} running", "refId": "A"}, {"expr": "vllm:num_requests_waiting", "legendFormat": "{{service}} waiting", "refId": "B"}]},
        {"id": 2, "type": "timeseries", "title": "Token throughput", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum by (service) (rate(vllm:prompt_tokens_total[5m]))", "legendFormat": "{{service}} prompt", "refId": "A"}, {"expr": "sum by (service) (rate(vllm:generation_tokens_total[5m]))", "legendFormat": "{{service}} generation", "refId": "B"}]},
        {"id": 3, "type": "timeseries", "title": "Time to first token", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "histogram_quantile(0.5, sum by (le, service) (rate(vllm:time_to_first_token_seconds_bucket[5m])))", "legendFormat": "{{service}} p50", "refId": "A"}, {"expr": "histogram_quantile(0.95, sum by (le, service) (rate(vllm:time_to_first_token_seconds_bucket[5m])))", "legendFormat": "{{service}} p95", "refId": "B"}]},
        {"id": 4, "type": "timeseries", "title": "Inter-token latency", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "histogram_quantile(0.5, sum by (le, service) (rate(vllm:inter_token_latency_seconds_bucket[5m])))", "legendFormat": "{{service}} p50", "refId": "A"}, {"expr": "histogram_quantile(0.95, sum by (le, service) (rate(vllm:inter_token_latency_seconds_bucket[5m])))", "legendFormat": "{{service}} p95", "refId": "B"}]},
        {"id": 5, "type": "timeseries", "title": "KV cache usage", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "max by (service) (vllm:kv_cache_usage_perc)", "legendFormat": "{{service}}", "refId": "A"}]},
        {"id": 6, "type": "timeseries", "title": "Prefix cache hit rate", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum by (service) (rate(vllm:prefix_cache_hits_total[5m])) / sum by (service) (rate(vllm:prefix_cache_queries_total[5m]))", "legendFormat": "{{service}}", "refId": "A"}]},
        {"id": 7, "type": "timeseries", "title": "Preemptions (1h)", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum by (service) (increase(vllm:num_preemptions_total[1h]))", "legendFormat": "{{service}}", "refId": "A"}]},
        {"id": 8, "type": "stat", "title": "Active vLLM targets", "gridPos": {"h": 4, "w": 12, "x": 12, "y": 24}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(up{namespace=\"ai\", service=\"nvidia-gb10-qwen38\"} == 1)", "refId": "A"}]}
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["vllm", "inference"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "vLLM Inference",
      "uid": "vllm-inference",
      "version": 1
    }
