apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ai-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-nvidia-01-data
spec:
  capacity:
    storage: 1200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ai-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/ai-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ai-nvidia-01
---
