# Copy to proxmox-config.secret.yaml. Do not commit the copy.
# The API token must be dedicated to Karpenter and limited to the privileges
# documented by karpenter-provider-proxmox; do not use the Terraform admin token.
apiVersion: v1
kind: Secret
metadata:
  name: karpenter-provider-proxmox
  namespace: kube-system
type: Opaque
stringData:
  config.yaml: |
    clusters:
      # Use a numeric API address. Kubernetes DNS does not resolve the local
      # pve.local.cisien.com split-DNS name from workload Pods.
      - url: https://172.16.0.12:8006/api2/json
        insecure: true
        token_id: "REPLACE_WITH_KARPENTER_TOKEN_ID"
        token_secret: "REPLACE_WITH_KARPENTER_TOKEN_SECRET"
        region: homelab
